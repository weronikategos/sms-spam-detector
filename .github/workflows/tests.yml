name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (trains the model) and check the API
        run: |
          docker build -t sms-spam-detector .
          docker run -d -p 8000:8000 --name spam sms-spam-detector
          for i in $(seq 1 20); do curl -fs http://localhost:8000/ > /dev/null && break; sleep 1; done
          curl -fs -X POST http://localhost:8000/api/predict \
               -H "Content-Type: application/json" \
               -d '{"text": "WIN a FREE prize now, call to claim"}' | tee result.json
          grep -q '"label":"spam"' result.json
